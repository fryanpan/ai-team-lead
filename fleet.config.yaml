# Marshal fleet config: declare the worker clients Marshal can route tasks to. Each client pins a
# backend + model + permission. See fleet.config.example.yaml in the Marshal repo for the full
# reference (opencode-go, EastRouter, usage_api, worktree_setup, verify, context, etc.).
defaults:
  permission: safe-edit
  timeout_s: 900

# Add clients under `clients:` (an empty map = zero clients until you add one). Example - uncomment
# and edit, then run `marshal doctor` to verify the backend is available:
clients:
  codex-readonly:
    backend: codex
    model: gpt-5.6-luna
    permission: read-only

  # claude:
  #   backend: claude-code
  #   model: claude-sonnet-4-6

  # codex:
  #   backend: codex
  #   model: gpt-5.6-luna
  # Auth: `codex login` (ChatGPT account) or OPENAI_API_KEY.

  # --- read-only reviewers -------------------------------------------------------------------
  # Review teams (`marshal team run` / the run_team MCP tool) refuse any role whose client is not
  # permission: read-only - a reviewer that can edit is not a reviewer - so a panel needs its own
  # entries. Point each lens at a DIFFERENT backend: heterogeneous reviewers catch what one model's
  # blind spot hides, and the usage ledger then shows what each provider cost.
  # Starter panels to copy into <repo>/teams/ live in the Marshal repo's examples/teams/.
  # claude-readonly:
  #   backend: claude-code
  #   model: claude-sonnet-4-6
  #   permission: read-only
  # cursor-readonly:
  #   backend: cursor
  #   permission: read-only
  # codex-readonly:
  #   backend: codex
  #   model: gpt-5.6-luna
  #   permission: read-only

# Detected project layout - suggested worktree_setup (uncomment + adjust; see
# fleet.config.example.yaml; consider a matching `verify:` gate too):
# Python project at the repo root (pyproject.toml):
# worktree_setup: uv sync
